        { key: 'notes', header: '備考', label: '備考（任意）', type: 'textarea' }
      ]
    };

    // ウィザード状態
    var wizardState = {
      active: false,
      formType: null,
      schema: [],
      currentStep: -1,  // -1 = フォーム選択, 0~ = 質問
      answers: {},
      chatHistory: []
    };

    // データを再読み込み（ウィザード用）
    function reloadWizardData(callback) {
      var loadCount = 0;
      var totalLoads = 2;

      function checkComplete() {
        loadCount++;
        if (loadCount >= totalLoads && callback) callback();
      }

      // 患者データを読み込み
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success && result.data) {
            dictionaries = result.data;
            patientOptions = [];
            for (var pid in dictionaries.patients) {
              patientOptions.push({
                id: pid,
                name: dictionaries.patients[pid],
                label: pid + ' ' + dictionaries.patients[pid]
              });
            }
            patientOptions.sort(function(a, b) { return a.id.localeCompare(b.id); });
          }
          checkComplete();
        })
        .withFailureHandler(function(e) {
          console.error('Failed to load dictionaries:', e);
          checkComplete();
        })
        .input_getDictionaries();

      // スタッフデータを読み込み
      google.script.run
        .withSuccessHandler(function(options) {
          staffOptions = options || [];
          checkComplete();
        })
        .withFailureHandler(function(e) {
          console.error('Failed to load staff options:', e);
          checkComplete();
        })
        .input_getStaffOptions();
    }

    // ウィザードを開く
    function openWizard() {
      wizardState = {
        active: true,
        formType: null,
        schema: [],
        currentStep: -1,
        answers: {},
        chatHistory: []
      };
      document.getElementById('wizardPanel').classList.add('active');
      document.getElementById('wizardTitle').textContent = '新規登録ウィザード';

      // データが空の場合は再読み込み
      if (patientOptions.length === 0 || staffOptions.length === 0) {
        document.getElementById('wizardInputContainer').innerHTML = '<div style="text-align:center; color:#666;">データを読み込み中...</div>';
        reloadWizardData(function() {
          renderWizardStep();
        });
      } else {
        renderWizardStep();
      }
    }

    // ウィザードを閉じる
    function closeWizard() {
      if (wizardState.currentStep > 0 && !confirm('入力内容を破棄してウィザードを閉じますか？')) return;
      wizardState.active = false;
      document.getElementById('wizardPanel').classList.remove('active');
    }

    // 現在のステップを描画
    function renderWizardStep() {
      var chatEl = document.getElementById('wizardChat');
      var questionEl = document.getElementById('wizardQuestion');
      var hintEl = document.getElementById('wizardHint');
      var inputEl = document.getElementById('wizardInputContainer');
      var errorEl = document.getElementById('wizardError');
      var backBtn = document.getElementById('wizardBackBtn');
      var skipBtn = document.getElementById('wizardSkipBtn');
      var nextBtn = document.getElementById('wizardNextBtn');
      var progressBar = document.getElementById('wizardProgressBar');

      errorEl.textContent = '';

      // フォーム選択ステップ
      if (wizardState.currentStep === -1) {
        questionEl.textContent = 'どの登録をしますか？';
        hintEl.textContent = '';
        inputEl.innerHTML = '<select id="wizardFormSelect">' +
          '<option value="">-- 選択してください --</option>' +
          '<option value="患者マスタ">患者マスタ</option>' +
          '<option value="スタッフマスタ">スタッフマスタ</option>' +
          '<option value="個別変更リクエスト">患者個別変更</option>' +
          '<option value="スタッフ個別変更">スタッフ個別変更</option>' +
          '<option value="イベントリクエスト">イベントリクエスト</option>' +
          '</select>';
        backBtn.disabled = true;
        skipBtn.style.display = 'none';
        nextBtn.textContent = '開始';
        progressBar.style.width = '0%';
        chatEl.innerHTML = '<div class="chat-message bot"><div class="chat-label">システム</div><div class="chat-bubble">こんにちは！新規登録を対話形式でお手伝いします。どのデータを登録しますか？</div></div>';
        return;
      }

      var schema = wizardState.schema;
      var step = schema[wizardState.currentStep];
      var progress = ((wizardState.currentStep + 1) / schema.length) * 100;
      progressBar.style.width = progress + '%';

      // 確認ステップ（最後）
      if (wizardState.currentStep >= schema.length) {
        questionEl.textContent = '入力内容の確認';
        hintEl.textContent = '内容を確認して「登録」ボタンを押してください';
        inputEl.innerHTML = renderPreview();
        backBtn.disabled = false;
        skipBtn.style.display = 'none';
        nextBtn.textContent = '登録';
        nextBtn.className = 'wizard-btn success';
        progressBar.style.width = '100%';
        return;
      }

      // 通常の質問ステップ
      questionEl.textContent = step.label;
      hintEl.textContent = step.hint || '';
      inputEl.innerHTML = renderWizardInput(step);
      backBtn.disabled = wizardState.currentStep === 0;
      skipBtn.style.display = step.required ? 'none' : 'inline-block';
      nextBtn.textContent = '次へ';
      nextBtn.className = 'wizard-btn primary';

      // 入力フィールドにフォーカス
      var firstInput = inputEl.querySelector('input, select, textarea');
      if (firstInput) firstInput.focus();

      // チャット履歴を表示
      renderChatHistory();
    }

    // 入力UIを生成
    function renderWizardInput(step) {
      var currentVal = wizardState.answers[step.key] || step.defaultValue || '';

      switch (step.type) {
        case 'autoId':
          return '<div style="padding:10px; background:#f0f0f0; border-radius:6px; text-align:center; color:#666;">自動発行（' + step.prefix + '連番）</div>';
        case 'text':
          return '<input type="text" id="wizardInput" value="' + escapeHtml(currentVal) + '" placeholder="入力してください" />';
        case 'textarea':
          return '<textarea id="wizardInput" placeholder="入力してください">' + escapeHtml(currentVal) + '</textarea>';
        case 'number':
          return '<input type="number" id="wizardInput" value="' + escapeHtml(currentVal) + '" ' + (step.min !== undefined ? 'min="' + step.min + '"' : '') + ' placeholder="数値を入力" />';
        case 'date':
          return '<input type="date" id="wizardInput" value="' + escapeHtml(currentVal) + '" />';
        case 'time':
          var timeVal = currentVal ? String(currentVal).substring(0, 5) : '';
          return '<select id="wizardInput"><option value="">-- 選択 --</option>' + TIME_OPTIONS.map(function(t) {
            return '<option value="' + t + '"' + (t === timeVal ? ' selected' : '') + '>' + t + '</option>';
          }).join('') + '</select>';
        case 'select':
          return '<select id="wizardInput">' + step.options.map(function(opt) {
            return '<option value="' + escapeHtml(opt) + '"' + (opt === currentVal ? ' selected' : '') + '>' + (opt || '-- 選択 --') + '</option>';
          }).join('') + '</select>';
        case 'multiSelect':
          var selected = currentVal ? currentVal.split(',') : [];
          return '<div class="wizard-checkboxes">' + step.options.map(function(opt) {
            var checked = selected.indexOf(opt) >= 0 ? ' checked' : '';
            return '<label><input type="checkbox" value="' + escapeHtml(opt) + '"' + checked + '>' + escapeHtml(opt) + '</label>';
          }).join('') + '</div>';
        case 'staffMultiSelect':
          var selectedStaff = currentVal ? currentVal.split(',') : [];
          if (staffOptions.length === 0) return '<div style="color:#999;">スタッフデータがありません</div>';
          return '<div class="wizard-checkboxes" style="max-height:120px; overflow-y:auto;">' +
            '<div style="margin-bottom:4px;"><button type="button" onclick="this.parentElement.parentElement.querySelectorAll(\'input[type=checkbox]\').forEach(function(cb){cb.checked=false;});" style="font-size:11px; padding:2px 6px; cursor:pointer;">選択なし（クリア）</button></div>' +
            staffOptions.map(function(s) {
              var checked = selectedStaff.indexOf(s.id) >= 0 ? ' checked' : '';
              return '<label><input type="checkbox" value="' + escapeHtml(s.id) + '"' + checked + '>' + escapeHtml(s.label) + '</label>';
            }).join('') + '</div>';
        case 'visitWeeksSelect':
          var selectedWeeks = currentVal ? currentVal.split(',') : [];
          var weeks = ['1', '2', '3', '4', '5'];
          return '<div class="wizard-checkboxes" style="display:flex; gap:12px; flex-wrap:wrap;">' +
            weeks.map(function(w) {
              var checked = selectedWeeks.indexOf(w) >= 0 ? ' checked' : '';
              return '<label style="display:flex; align-items:center; gap:4px; cursor:pointer; padding:6px 10px; border:1px solid #ddd; border-radius:6px; background:#fff;">' +
                '<input type="checkbox" value="' + w + '"' + checked + ' style="width:18px; height:18px; cursor:pointer;">' +
                '<span style="font-size:14px;">' + w + '週目</span></label>';
            }).join('') + '</div>';
        case 'patientSelect':
          if (patientOptions.length === 0) return '<div style="color:#999;">患者データがありません</div>';
          return '<select id="wizardInput"><option value="">-- 選択 --</option>' + patientOptions.map(function(p) {
            return '<option value="' + escapeHtml(p.id) + '"' + (p.id === currentVal ? ' selected' : '') + '>' + escapeHtml(p.label) + '</option>';
          }).join('') + '</select>';
        case 'staffSelect':
          if (staffOptions.length === 0) return '<div style="color:#999;">スタッフデータがありません</div>';
          return '<select id="wizardInput"><option value="">-- 選択 --</option>' + staffOptions.map(function(s) {
            return '<option value="' + escapeHtml(s.id) + '"' + (s.id === currentVal ? ' selected' : '') + '>' + escapeHtml(s.label) + '</option>';
          }).join('') + '</select>';
        case 'toggle':
          var isTrue = currentVal === true || currentVal === 'TRUE' || currentVal === 'true';
          return '<select id="wizardInput">' +
            '<option value="FALSE"' + (!isTrue ? ' selected' : '') + '>いいえ</option>' +
            '<option value="TRUE"' + (isTrue ? ' selected' : '') + '>はい</option>' +
            '</select>';
        default:
          return '<input type="text" id="wizardInput" value="' + escapeHtml(currentVal) + '" />';
      }
    }

    // 入力値を取得
    function getWizardInputValue() {
      var input = document.getElementById('wizardInput');
      if (input) return input.value;

      // チェックボックス（複数選択）
      var checkboxes = document.querySelectorAll('#wizardInputContainer input[type="checkbox"]');
      if (checkboxes.length > 0) {
        var vals = [];
        checkboxes.forEach(function(cb) { if (cb.checked) vals.push(cb.value); });
        return vals.join(',');
      }
      return '';
    }

    // バリデーション
    function validateWizardInput(step, value) {
      if (step.type === 'autoId') return null; // 自動なのでOK
      if (step.required && (!value || value.trim() === '')) return '必須項目です';
      if (step.type === 'number' && value) {
        var num = parseFloat(value);
        if (isNaN(num)) return '数値を入力してください';
        if (step.min !== undefined && num < step.min) return step.min + '以上を入力してください';
      }
      if (step.type === 'multiSelect' && step.required && (!value || value.trim() === '')) return '1つ以上選択してください';
      return null;
    }

    // 時間計算ヘルパー関数
    function addMinutesToTimeStr(timeStr, minutes) {
      var parts = timeStr.split(':');
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var totalMin = h * 60 + m + minutes;
      var newH = Math.floor(totalMin / 60) % 24;
      var newM = totalMin % 60;
      return String(newH).padStart(2, '0') + ':' + String(newM).padStart(2, '0') + ':00';
    }

    function subtractMinutesFromTimeStr(timeStr, minutes) {
      return addMinutesToTimeStr(timeStr, -minutes);
    }

    // 条件付きステップをスキップすべきか判定
    // conditionalOn.value は文字列または配列をサポート
    function shouldSkipStep(step) {
      if (!step.conditionalOn) return false;
      var condKey = step.conditionalOn.key;
      var condValue = step.conditionalOn.value;
      var currentValue = wizardState.answers[condKey];

      // boolean値の正規化（TRUE/FALSE文字列をbooleanに変換）
      var normalizedCurrent = currentValue;
      if (currentValue === 'TRUE' || currentValue === 'true') normalizedCurrent = true;
      if (currentValue === 'FALSE' || currentValue === 'false') normalizedCurrent = false;

      // value が配列の場合、いずれかに一致すればスキップしない
      if (Array.isArray(condValue)) {
        return condValue.indexOf(currentValue) === -1 && condValue.indexOf(normalizedCurrent) === -1;
      }
      // 単一値の場合（boolean比較も含む）
      return currentValue !== condValue && normalizedCurrent !== condValue;
    }


    // 次の有効なステップへ進む
    function advanceToNextValidStep() {
      var schema = wizardState.schema;
      wizardState.currentStep++;
      // 条件付きステップをスキップ
      while (wizardState.currentStep < schema.length && shouldSkipStep(schema[wizardState.currentStep])) {
        wizardState.currentStep++;
      }
    }

    // 次へ
    function wizardNext() {
      var errorEl = document.getElementById('wizardError');

      // フォーム選択
      if (wizardState.currentStep === -1) {
        var formSelect = document.getElementById('wizardFormSelect');
        var formType = formSelect ? formSelect.value : '';
        if (!formType) {
          errorEl.textContent = '登録タイプを選択してください';
          return;
        }
        wizardState.formType = formType;
        wizardState.schema = FORM_SCHEMA[formType] || [];
        wizardState.currentStep = 0;
        document.getElementById('wizardTitle').textContent = formType + ' - 新規登録';
        addChatMessage('user', formType);
        addChatMessage('bot', 'では、' + formType + 'の登録を始めます。順番に質問していきますね。');
        renderWizardStep();
        return;
      }

      var schema = wizardState.schema;

      // 確認ステップ → 登録実行
      if (wizardState.currentStep >= schema.length) {
        submitWizard();
        return;
      }

      // 通常ステップ
      var step = schema[wizardState.currentStep];
      var value = getWizardInputValue();

      // バリデーション
      var error = validateWizardInput(step, value);
      if (error) {
        errorEl.textContent = error;
        return;
      }

      // 値を正規化して保存
      if (step.type === 'time' && value) {
        value = value + ':00'; // HH:MM → HH:MM:SS
      }
      wizardState.answers[step.key] = value;

      // チャットに追加
      var displayValue = formatAnswerForDisplay(step, value);
      if (step.type !== 'autoId') {
        addChatMessage('user', displayValue || '（未入力）');
      }

      // 時間タイプに基づく自動時間設定
      if (step.key === 'timeType') {
        var autoTimeSet = null;
        if (value === '午前') {
          autoTimeSet = { start: '09:00:00', end: '12:00:00', label: '午前（09:00〜12:00）' };
        } else if (value === '午後') {
          autoTimeSet = { start: '13:00:00', end: '17:00:00', label: '午後（13:00〜17:00）' };
        } else if (value === '終日') {
          autoTimeSet = { start: '09:00:00', end: '18:00:00', label: '終日（09:00〜18:00）' };
        }
        // 午前/午後/終日の場合、時間を自動設定し質問をスキップ
        if (autoTimeSet) {
          wizardState.answers['timeStart'] = autoTimeSet.start;
          wizardState.answers['timeEnd'] = autoTimeSet.end;
          addChatMessage('bot', '時間を自動設定しました: ' + autoTimeSet.label);
          // fixedTarget, timeStart, timeEnd をスキップ
          wizardState.currentStep++;
          while (wizardState.currentStep < schema.length) {
            var nextKey = schema[wizardState.currentStep].key;
            if (nextKey === 'fixedTarget' || nextKey === 'timeStart' || nextKey === 'timeEnd') {
              wizardState.currentStep++;
            } else {
              break;
            }
          }
          // 次の質問を表示
          if (wizardState.currentStep < schema.length) {
            addChatMessage('bot', schema[wizardState.currentStep].label);
          } else {
            addChatMessage('bot', '全ての質問が完了しました。内容を確認してください。');
          }
          renderWizardStep();
          return;
        }
        // 固定タイプの場合は、fixedTargetの質問へ進む
        if (value === '固定') {
          advanceToNextValidStep();
          if (wizardState.currentStep < schema.length) {
            addChatMessage('bot', schema[wizardState.currentStep].label);
          }
          renderWizardStep();
          return;
        }
      }

      // 固定タイプで開始/終了選択後の処理
      if (step.key === 'fixedTarget') {
        var fixedTarget = value; // '開始' or '終了'
        advanceToNextValidStep();
        // fixedTargetに応じてラベルを変更
        if (fixedTarget === '開始') {
          addChatMessage('bot', '固定する開始時刻は？');
        } else {
          // 終了固定の場合、timeStartをスキップしてtimeEndへ
          if (wizardState.currentStep < schema.length && schema[wizardState.currentStep].key === 'timeStart') {
            wizardState.currentStep++;
          }
          addChatMessage('bot', '固定する終了時刻は？');
        }
        renderWizardStep();
        return;
      }

      // 固定タイプでtimeStart入力後、timeEndを自動計算
      if (step.key === 'timeStart' && wizardState.answers['timeType'] === '固定' && wizardState.answers['fixedTarget'] === '開始') {
        var serviceMin = parseInt(wizardState.answers['serviceMin'], 10) || 0;
        var calcEnd = addMinutesToTimeStr(value, serviceMin);
        wizardState.answers['timeEnd'] = calcEnd;
        addChatMessage('bot', '終了時刻を自動計算しました: ' + calcEnd.substring(0, 5));
        // timeEnd をスキップ
        wizardState.currentStep++;
        if (wizardState.currentStep < schema.length && schema[wizardState.currentStep].key === 'timeEnd') {
          wizardState.currentStep++;
        }
        if (wizardState.currentStep < schema.length) {
          addChatMessage('bot', schema[wizardState.currentStep].label);
        } else {
          addChatMessage('bot', '全ての質問が完了しました。内容を確認してください。');
        }
        renderWizardStep();
        return;
      }

      // 固定タイプでtimeEnd入力後、timeStartを自動計算
      if (step.key === 'timeEnd' && wizardState.answers['timeType'] === '固定' && wizardState.answers['fixedTarget'] === '終了') {
        var serviceMin = parseInt(wizardState.answers['serviceMin'], 10) || 0;
        var calcStart = subtractMinutesFromTimeStr(value, serviceMin);
        wizardState.answers['timeStart'] = calcStart;
        addChatMessage('bot', '開始時刻を自動計算しました: ' + calcStart.substring(0, 5));
        advanceToNextValidStep();
        if (wizardState.currentStep < schema.length) {
          addChatMessage('bot', schema[wizardState.currentStep].label);
        } else {
          addChatMessage('bot', '全ての質問が完了しました。内容を確認してください。');
        }
        renderWizardStep();
        return;
      }

      // 次のステップへ
      advanceToNextValidStep();
      if (wizardState.currentStep < schema.length) {
        var nextStep = schema[wizardState.currentStep];
        addChatMessage('bot', nextStep.label);
      } else {
        addChatMessage('bot', '全ての質問が完了しました。内容を確認してください。');
      }
      renderWizardStep();
    }

    // 戻る
    function wizardBack() {
      if (wizardState.currentStep <= 0) return;
      wizardState.currentStep--;
      renderWizardStep();
    }

    // スキップ
    function wizardSkip() {
      var schema = wizardState.schema;
      var step = schema[wizardState.currentStep];
      if (step.required) return;
      wizardState.answers[step.key] = '';
      addChatMessage('user', '（スキップ）');
      wizardState.currentStep++;
      if (wizardState.currentStep < schema.length) {
        addChatMessage('bot', schema[wizardState.currentStep].label);
      }
      renderWizardStep();
    }

    // 回答を表示用にフォーマット
    function formatAnswerForDisplay(step, value) {
      if (!value) return '';
      if (step.type === 'staffMultiSelect') {
        return value.split(',').map(function(id) {
          var s = staffOptions.find(function(x) { return x.id === id; });
          return s ? s.label : id;
        }).join(', ');
      }
      if (step.type === 'staffSelect') {
        var s = staffOptions.find(function(x) { return x.id === value; });
        return s ? s.label : value;
      }
      if (step.type === 'patientSelect') {
        var p = patientOptions.find(function(x) { return x.id === value; });
        return p ? p.label : value;
      }
      if (step.type === 'time') {
        return value.substring(0, 5);
      }
      if (step.type === 'toggle') {
        return value === 'TRUE' ? 'はい' : 'いいえ';
      }
      return value;
    }

    // チャットメッセージを追加
    function addChatMessage(role, text) {
      wizardState.chatHistory.push({ role: role, text: text });
    }

    // チャット履歴を描画
    function renderChatHistory() {
      var chatEl = document.getElementById('wizardChat');
      var html = wizardState.chatHistory.map(function(msg) {
        var labelText = msg.role === 'bot' ? 'システム' : 'あなた';
        return '<div class="chat-message ' + msg.role + '"><div class="chat-label">' + labelText + '</div><div class="chat-bubble">' + escapeHtml(msg.text) + '</div></div>';
      }).join('');
      chatEl.innerHTML = html;
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // プレビューを生成
    function renderPreview() {
      var schema = wizardState.schema;
      var html = '<div class="wizard-preview"><table>';
      schema.forEach(function(step) {
        var value = wizardState.answers[step.key] || '';
        var displayValue = formatAnswerForDisplay(step, value);
        if (step.type === 'autoId') displayValue = '（自動発行）';
        html += '<tr><th>' + escapeHtml(step.header) + '</th><td>' + escapeHtml(displayValue || '-') + '</td></tr>';
      });
      html += '</table></div>';
      return html;
    }

    // 登録実行
    function submitWizard() {
      var nextBtn = document.getElementById('wizardNextBtn');
      var errorEl = document.getElementById('wizardError');
      nextBtn.disabled = true;
      nextBtn.textContent = '登録中...';
      errorEl.textContent = '';

      // フォームタイプをウィザードで選択したものに固定
      var formType = wizardState.formType;
      var answers = wizardState.answers;

      // デバッグ用ログ
      console.log('submitWizard: formType=', formType);
      console.log('submitWizard: answers=', JSON.stringify(answers));

      // タイムアウト設定（30秒）
      var timeoutId = setTimeout(function() {
        nextBtn.disabled = false;
        nextBtn.textContent = '登録';
        errorEl.textContent = 'タイムアウト: サーバーからの応答がありませんでした';
      }, 30000);

      // サーバーに送信（末尾に追加）
      google.script.run
        .withSuccessHandler(function(result) {
          clearTimeout(timeoutId);
          console.log('submitWizard success:', result);
          nextBtn.disabled = false;
          nextBtn.textContent = '登録';
          if (result && result.success) {
            showToast('success', result.message || '登録しました');
            wizardState.active = false;
            document.getElementById('wizardPanel').classList.remove('active');
            // 登録したフォームタイプに対応するシートに切り替えてリロード
            if (formType && formType !== currentSheetName) {
              loadSheet(formType);
            } else {
              reloadCurrentSheet();
            }
          } else {
            errorEl.textContent = (result && result.error) || '登録に失敗しました';
          }
        })
        .withFailureHandler(function(e) {
          clearTimeout(timeoutId);
          console.error('submitWizard error:', e);
          nextBtn.disabled = false;
          nextBtn.textContent = '登録';
          errorEl.textContent = 'エラー: ' + (e.message || String(e));
        })
        .input_createRowFromWizard(formType, answers, null);
    }

    // ============================================================
    // 同行割付ウィザード
    // ============================================================
    var mentorWizardState = {
      weekStart: null,  // Date
      traineeId: '',
      dayOffMap: {},    // "staffId|yyyy/MM/dd": true
      rows: []          // [{date, mentor, band, priority, status}]
    };
    var WEEKDAYS_LABEL = ['月', '火', '水', '木', '金', '土', '日'];

    function getMonday(d) {
      var date = new Date(d);
      var day = date.getDay();
      var diff = date.getDate() - day + (day === 0 ? -6 : 1);
      date.setDate(diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function formatDateJP(d) {
      return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    }

    function openMentorWizard() {
      var panel = document.getElementById('mentorWizardPanel');
      panel.classList.add('active');

      // 今週の月曜を初期値
      mentorWizardState.weekStart = getMonday(new Date());
      updateMentorWeekDisplay();

      // 新人リストを設定
      var traineeSelect = document.getElementById('wizardTraineeSelect');
      traineeSelect.innerHTML = '<option value="">-- 新人を選択 --</option>';
      staffOptions.forEach(function(s) {
        // スキル=新人を優先表示（全員表示）
        var label = s.label + (s.skill === '新人' ? ' ★新人' : '');
        traineeSelect.innerHTML += '<option value="' + s.id + '">' + label + '</option>';
      });

      // グリッド初期化
      mentorWizardState.traineeId = '';
      mentorWizardState.rows = [];
      renderMentorGrid();
    }

    function closeMentorWizard() {
      document.getElementById('mentorWizardPanel').classList.remove('active');
    }

    function updateMentorWeekDisplay() {
      var start = mentorWizardState.weekStart;
      var end = new Date(start);
      end.setDate(end.getDate() + 6);
      document.getElementById('mentorWeekDisplay').textContent = formatDateJP(start) + ' 〜 ' + formatDateJP(end);
      if (mentorWizardState.traineeId) {
        loadMentorPairsForWeek();
      }
    }

    function mentorWeekPrev() {
      mentorWizardState.weekStart.setDate(mentorWizardState.weekStart.getDate() - 7);
      updateMentorWeekDisplay();
      renderMentorGrid();
    }

    function mentorWeekNext() {
      mentorWizardState.weekStart.setDate(mentorWizardState.weekStart.getDate() + 7);
      updateMentorWeekDisplay();
      renderMentorGrid();
    }

    function onTraineeChange() {
      mentorWizardState.traineeId = document.getElementById('wizardTraineeSelect').value;
      if (mentorWizardState.traineeId) {
        loadMentorPairsForWeek();
      } else {
        mentorWizardState.rows = [];
        renderMentorGrid();
      }
    }

    function loadMentorPairsForWeek() {
      var start = mentorWizardState.weekStart;
      var end = new Date(start);
      end.setDate(end.getDate() + 6);

      google.script.run
        .withSuccessHandler(function(result) {
          // result: { pairs: [{date, mentor, band, priority}], dayOffMap: {...} }
          mentorWizardState.dayOffMap = result.dayOffMap || {};
          var existingPairs = result.pairs || [];

          // 7日分の行を初期化
          mentorWizardState.rows = [];
          for (var i = 0; i < 7; i++) {
            var d = new Date(start);
            d.setDate(d.getDate() + i);
            var dateStr = formatDateJP(d);

            // 既存データがあれば反映
            var existing = existingPairs.find(function(p) { return p.date === dateStr; });
            mentorWizardState.rows.push({
              date: dateStr,
              weekday: WEEKDAYS_LABEL[i],
              mentor: existing ? existing.mentor : '',
              band: existing ? existing.band : '終日',
              priority: existing ? existing.priority : 1
            });
          }
          renderMentorGrid();
        })
        .withFailureHandler(function(e) {
          console.error('loadMentorPairsForWeek error:', e);
          // エラー時は空で初期化
          mentorWizardState.rows = [];
          for (var i = 0; i < 7; i++) {
            var d = new Date(start);
            d.setDate(d.getDate() + i);
            mentorWizardState.rows.push({
              date: formatDateJP(d),
              weekday: WEEKDAYS_LABEL[i],
              mentor: '',
              band: '終日',
              priority: 1
            });
          }
          renderMentorGrid();
        })
        .input_getMentorPairsForWeek(mentorWizardState.traineeId, formatDateJP(start), formatDateJP(end));
    }

    function renderMentorGrid() {
      var tbody = document.getElementById('mentorGridBody');
      var traineeId = mentorWizardState.traineeId;

      if (!traineeId || mentorWizardState.rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999;">新人を選択してください</td></tr>';
        return;
      }

      var html = '';
      mentorWizardState.rows.forEach(function(row, i) {
        var mentorOptions = '<option value="">-- 未設定 --</option>';
        staffOptions.forEach(function(s) {
          if (s.id === traineeId) return; // trainee自身は除外
          var selected = (s.id === row.mentor) ? ' selected' : '';
          mentorOptions += '<option value="' + s.id + '"' + selected + '>' + s.label + '</option>';
        });

        var bandOptions = ['終日', '午前', '午後'].map(function(b) {
          return '<option value="' + b + '"' + (b === row.band ? ' selected' : '') + '>' + b + '</option>';
        }).join('');

        // 状態チェック
        var status = '';
        var statusClass = 'status-empty';
        if (row.mentor) {
          var traineeOff = mentorWizardState.dayOffMap[traineeId + '|' + row.date];
          var mentorOff = mentorWizardState.dayOffMap[row.mentor + '|' + row.date];
          if (traineeOff) {
            status = '⚠ 新人休み';
            statusClass = 'status-warn';
          } else if (mentorOff) {
            status = '⚠ メンター休み';
            statusClass = 'status-warn';
          } else {
            status = '✓ OK';
            statusClass = 'status-ok';
          }
        } else {
          status = '未設定';
        }

        html += '<tr>' +
          '<td>' + row.weekday + '</td>' +
          '<td>' + row.date + '</td>' +
          '<td><select id="mentorSelect_' + i + '" onchange="onMentorGridChange(' + i + ')">' + mentorOptions + '</select></td>' +
          '<td><select id="bandSelect_' + i + '" onchange="onMentorGridChange(' + i + ')">' + bandOptions + '</select></td>' +
          '<td class="' + statusClass + '">' + status + '</td>' +
          '</tr>';
      });
      tbody.innerHTML = html;
    }

    function onMentorGridChange(idx) {
      var mentor = document.getElementById('mentorSelect_' + idx).value;
      var band = document.getElementById('bandSelect_' + idx).value;
      mentorWizardState.rows[idx].mentor = mentor;
      mentorWizardState.rows[idx].band = band;
      renderMentorGrid();
    }

    function applyAllDaysSameMentor() {
      var mentor = prompt('全日に設定するメンターのスタッフIDを入力:\n（例: S001）');
      if (!mentor) return;
      mentorWizardState.rows.forEach(function(row) {
        row.mentor = mentor;
      });
      renderMentorGrid();
    }

    function applyWeekdayMentor() {
      var mentor = prompt('平日（月〜金）に設定するメンターのスタッフIDを入力:\n（例: S001）');
      if (!mentor) return;
      mentorWizardState.rows.forEach(function(row, i) {
        if (i < 5) row.mentor = mentor; // 月〜金
      });
      renderMentorGrid();
    }

    function clearMentorGrid() {
      mentorWizardState.rows.forEach(function(row) {
        row.mentor = '';
        row.band = '終日';
      });
      renderMentorGrid();
    }

    function saveMentorWizard() {
      var errorEl = document.getElementById('mentorWizardError');
      errorEl.textContent = '';

      if (!mentorWizardState.traineeId) {
        errorEl.textContent = '新人を選択してください';
        return;
      }

      var start = mentorWizardState.weekStart;
      var end = new Date(start);
      end.setDate(end.getDate() + 6);

      // mentor が設定されている行のみ保存
      var rowsToSave = mentorWizardState.rows.filter(function(row) {
        return row.mentor && row.mentor.trim() !== '';
      }).map(function(row) {
        return {
          date: row.date,
          mentor: row.mentor,
          band: row.band,
          priority: row.priority || 1
        };
      });

      var saveBtn = document.getElementById('btnSaveMentorWizard');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      google.script.run
        .withSuccessHandler(function(result) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存';
          if (result && result.success) {
            showToast('success', '同行割付を保存しました（' + result.savedCount + '件）');
            closeMentorWizard();
            // スタッフ同行割付タブにいる場合は再読み込み
            if (currentSheetName === 'スタッフ同行割付') {
              reloadCurrentSheet();
            }
          } else {
            errorEl.textContent = (result && result.error) || '保存に失敗しました';
          }
        })
        .withFailureHandler(function(e) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存';
          errorEl.textContent = 'エラー: ' + (e.message || String(e));
        })
        .input_saveMentorPairsWizard({
          traineeId: mentorWizardState.traineeId,
          from: formatDateJP(start),
          to: formatDateJP(end),
          rows: rowsToSave
        });
    }

    // ============================================================
    // 特別訪問週間ウィザード（新仕様：時間帯/固定対応）
    // ============================================================
    var specialWeekState = {
      weekStart: null,
      patientId: null,
      patientName: '',
      mode: '追加',
      reason: '',
      days: [],
      normalByDate: {},
      changesByDate: {},
      specialRows: []
    };

    function openSpecialWeekWizard() {
      var panel = document.getElementById('specialWeekWizardPanel');
      panel.classList.add('active');

      // 特別行の表示状態をリセット
      specialWeekVisibleRows = 1;

      var today = new Date();
      specialWeekState.weekStart = getWeekStartMonday(today);
      updateSpecialWeekDisplay();

      var sel = document.getElementById('specialWeekPatientSelect');
      sel.innerHTML = '<option value="">-- 患者を選択 --</option>';
      patientOptions.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.label;
        sel.appendChild(opt);
      });

      specialWeekState.patientId = null;
      specialWeekState.patientName = '';
      specialWeekState.mode = '追加';
      specialWeekState.reason = '';

      onSpecialWeekModeChange();
      clearSpecialWeekGrid();

    function closeSpecialWeekWizard() {
      document.getElementById('specialWeekWizardPanel').classList.remove('active');
    }

    function getWeekStartMonday(d) {
      var date = new Date(d);
      var day = date.getDay();
      var diff = day === 0 ? -6 : 1 - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function updateSpecialWeekDisplay() {
      var start = specialWeekState.weekStart;
      var end = new Date(start);
      end.setDate(end.getDate() + 6);
      document.getElementById('specialWeekDisplay').textContent =
        formatDateJP(start) + ' 〜 ' + formatDateJP(end);

      var WEEKDAYS = ['月', '火', '水', '木', '金', '土', '日'];
      for (var i = 0; i < 7; i++) {
        var d = new Date(start);
        d.setDate(d.getDate() + i);
        var th = document.getElementById('swTh' + i);
        if (th) {
          th.textContent = WEEKDAYS[i] + ' (' + (d.getMonth() + 1) + '/' + d.getDate() + ')';
        }
      }

    function specialWeekPrev() {
      specialWeekState.weekStart.setDate(specialWeekState.weekStart.getDate() - 7);
      updateSpecialWeekDisplay();
      if (specialWeekState.patientId) loadSpecialWeekData();
    }

    function specialWeekNext() {
      specialWeekState.weekStart.setDate(specialWeekState.weekStart.getDate() + 7);
      updateSpecialWeekDisplay();
      if (specialWeekState.patientId) loadSpecialWeekData();
    }

    function onSpecialWeekPatientChange() {
      var sel = document.getElementById('specialWeekPatientSelect');
      specialWeekState.patientId = sel.value || null;
      if (sel.selectedIndex > 0) {
        specialWeekState.patientName = sel.options[sel.selectedIndex].textContent;
      } else {
        specialWeekState.patientName = '';
      }
      if (specialWeekState.patientId) {
        loadSpecialWeekData();
      } else {
        clearSpecialWeekGrid();
      }
    }

    function onSpecialWeekModeChange() {
      var modeEl = document.querySelector('input[name="specialWeekMode"]:checked');
      specialWeekState.mode = modeEl ? modeEl.value : '追加';
      var hintEl = document.getElementById('specialWeekModeHint');
      if (specialWeekState.mode === '追加') {
        hintEl.textContent = '通常スケジュールに加えて特別訪問を追加';
      } else {
        hintEl.textContent = '通常スケジュールを置換して特別訪問のみ実施';
      }
      updateConflictArea();
    }

    function updateConflictArea() {
      var area = document.getElementById('specialWeekConflictArea');
      var hasChanges = Object.keys(specialWeekState.changesByDate).length > 0;
      area.style.display = hasChanges ? 'block' : 'none';
    }

    function loadSpecialWeekData() {
      var errorEl = document.getElementById('specialWeekWizardError');
      errorEl.textContent = '';

      google.script.run
        .withSuccessHandler(function(data) {
          if (!data || data.error) {
            errorEl.textContent = data ? data.error : 'データの取得に失敗しました';
            return;
          }
          specialWeekState.days = data.days || [];
          specialWeekState.normalByDate = data.normalByDate || {};
          specialWeekState.changesByDate = data.changesByDate || {};
          specialWeekState.specialRows = data.specialRows || [];

          // 既存データからモード・理由を復元
          if (specialWeekState.specialRows.length > 0) {
            var first = specialWeekState.specialRows[0];
            if (first.mode) {
              specialWeekState.mode = first.mode;
              var radio = document.querySelector('input[name="specialWeekMode"][value="' + specialWeekState.mode + '"]');
              if (radio) radio.checked = true;
              onSpecialWeekModeChange();
            }
            if (first.reason) {
              specialWeekState.reason = first.reason;
              document.getElementById('specialWeekReason').value = first.reason;
            }
          }

          updateConflictArea();
          renderSpecialWeekGrid();
        })
        .withFailureHandler(function(e) {
          errorEl.textContent = 'エラー: ' + (e.message || String(e));
        })
        .input_getSpecialWeekWizardData(formatDateJP(specialWeekState.weekStart), specialWeekState.patientId);
    }

    function clearSpecialWeekGrid() {
      var tbody = document.getElementById('specialWeekGridBody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#999; padding:20px;">患者を選択してください</td></tr>';
    }

    // 特別行の表示状態（初期は特別1のみ表示）
    var specialWeekVisibleRows = 1; // 1=特別1のみ, 2=特別1-2, 3=特別1-3

    function renderSpecialWeekGrid() {
      var tbody = document.getElementById('specialWeekGridBody');
      tbody.innerHTML = '';

      var ROW_LABELS = ['通常', '個別変更', '特別1', '特別2', '特別3'];

      // 既存データがあれば特別2,3も表示
      var spMap = {};
      (specialWeekState.specialRows || []).forEach(function(r) {
        spMap[r.dateStr + '|' + r.rowLabel] = r;
        // データがあれば行を表示
        if (r.rowLabel === '特別2' && specialWeekVisibleRows < 2) specialWeekVisibleRows = 2;
        if (r.rowLabel === '特別3' && specialWeekVisibleRows < 3) specialWeekVisibleRows = 3;
      });

      for (var rowIdx = 0; rowIdx < ROW_LABELS.length; rowIdx++) {
        var tr = document.createElement('tr');
        tr.id = 'swRow_' + rowIdx;

        // 特別2(rowIdx=3), 特別3(rowIdx=4)は条件付き表示
        if (rowIdx === 3 && specialWeekVisibleRows < 2) tr.style.display = 'none';
        if (rowIdx === 4 && specialWeekVisibleRows < 3) tr.style.display = 'none';

        var th = document.createElement('td');
        th.className = 'row-header';

        // 特別1行に「+」ボタン、特別2/3に「−」ボタンを追加
        if (rowIdx === 2) {
          th.innerHTML = ROW_LABELS[rowIdx] + ' <button type="button" onclick="addSpecialRow()" style="margin-left:4px;padding:0 6px;font-size:12px;cursor:pointer;" title="特別2を追加">+</button>';
        } else if (rowIdx === 3) {
          th.innerHTML = ROW_LABELS[rowIdx] +
            ' <button type="button" onclick="addSpecialRow()" style="margin-left:4px;padding:0 6px;font-size:12px;cursor:pointer;" title="特別3を追加">+</button>' +
            '<button type="button" onclick="removeSpecialRow(2)" style="margin-left:2px;padding:0 6px;font-size:12px;cursor:pointer;color:#c00;" title="特別2を非表示">−</button>';
        } else if (rowIdx === 4) {
          th.innerHTML = ROW_LABELS[rowIdx] +
            ' <button type="button" onclick="removeSpecialRow(3)" style="margin-left:4px;padding:0 6px;font-size:12px;cursor:pointer;color:#c00;" title="特別3を非表示">−</button>';
        } else {
          th.textContent = ROW_LABELS[rowIdx];
        }
        tr.appendChild(th);

        for (var dayIdx = 0; dayIdx < 7; dayIdx++) {
          var td = document.createElement('td');
          var dateStr = getDateStrForDay(dayIdx);

          if (rowIdx === 0) {
            td.className = 'cell-muted';
            var items = specialWeekState.normalByDate[dateStr] || [];
            if (items.length > 0) {
              td.innerHTML = items.map(function(x) { return '<div>' + (x.text || '') + '</div>'; }).join('');
            } else {
              td.textContent = '-';
            }
          } else if (rowIdx === 1) {
            td.className = 'cell-change';
            var changes = specialWeekState.changesByDate[dateStr] || [];
            if (changes.length > 0) {
              td.innerHTML = changes.map(function(c) { return '<div>' + (c.text || '') + '</div>'; }).join('');
            } else {
              td.textContent = '-';
            }
          } else {
            td.className = 'cell-special';
            var rowLabel = ROW_LABELS[rowIdx];
            var key = dateStr + '|' + rowLabel;
            var cur = spMap[key] || {};

            var timeType = cur.timeType || '時間帯';
            var needStaff = cur.needStaff || 1;
            var changeHandle = cur.changeHandle || 'そのまま残す';
            var html = '<div style="display:flex;flex-direction:column;gap:3px;">';
            html += '<select data-k="' + key + '" class="swTimeType" style="width:80px;">';
            html += '<option value="時間帯"' + (timeType==='時間帯'?' selected':'') + '>時間帯</option>';
            html += '<option value="固定"' + (timeType==='固定'?' selected':'') + '>固定</option>';
            html += '</select>';
            html += '<div style="display:flex;gap:2px;align-items:center;">';
            html += '<span style="font-size:10px;">早</span><input type="time" data-k="' + key + '" class="swEarliest" value="' + (cur.earliest||'') + '" style="width:75px;font-size:10px;">';
            html += '<span style="font-size:10px;">遅</span><input type="time" data-k="' + key + '" class="swLatest" value="' + (cur.latest||'') + '" style="width:75px;font-size:10px;">';
            html += '</div>';
            html += '<div style="display:flex;gap:2px;align-items:center;">';
            html += '<select data-k="' + key + '" class="swSvc" style="width:50px;font-size:10px;">';
            [30,45,60,90,120].forEach(function(m) {
              html += '<option value="' + m + '"' + ((Number(cur.svcMin||0)===m)?'selected':'') + '>' + m + '分</option>';
            });
            html += '</select>';
            html += '<select data-k="' + key + '" class="swNeedStaff" style="width:40px;font-size:10px;" title="必要スタッフ数">';
            [1,2,3].forEach(function(n) {
              html += '<option value="' + n + '"' + (needStaff===n?' selected':'') + '>' + n + '人</option>';
            });
            html += '</select>';
            html += '</div>';
            html += '<div style="display:flex;gap:2px;align-items:center;color:#888;font-size:9px;">';
            html += '<span>固定:</span><input type="time" data-k="' + key + '" class="swStart" value="' + (cur.start||'') + '" style="width:65px;font-size:9px;">';
            html += '<input type="time" data-k="' + key + '" class="swEnd" value="' + (cur.end||'') + '" style="width:65px;font-size:9px;">';
            html += '</div>';
            html += '<select data-k="' + key + '" class="swChangeHandle" style="width:100%;font-size:9px;" title="個別変更の扱い">';
            html += '<option value="そのまま残す"' + (changeHandle==='そのまま残す'?' selected':'') + '>個別変更を残す</option>';
            html += '<option value="置換する"' + (changeHandle==='置換する'?' selected':'') + '>個別変更を置換</option>';
            html += '</select>';
            html += '</div>';

            td.innerHTML = html;
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    function addSpecialRow() {
      if (specialWeekVisibleRows < 3) {
        specialWeekVisibleRows++;
        var row = document.getElementById('swRow_' + (specialWeekVisibleRows + 1));
        if (row) row.style.display = '';
      }
    }

    function removeSpecialRow(rowNum) {
      // rowNum: 2=特別2, 3=特別3
      if (rowNum === 3 && specialWeekVisibleRows >= 3) {
        var row3 = document.getElementById('swRow_4');
        if (row3) row3.style.display = 'none';
        specialWeekVisibleRows = 2;
      } else if (rowNum === 2 && specialWeekVisibleRows >= 2) {
        var row2 = document.getElementById('swRow_3');
        var row3 = document.getElementById('swRow_4');
        if (row2) row2.style.display = 'none';
        if (row3) row3.style.display = 'none';
        specialWeekVisibleRows = 1;
      }
    }

    function getDateStrForDay(dayIdx) {
      var d = new Date(specialWeekState.weekStart);
      d.setDate(d.getDate() + dayIdx);
      return formatDateJP(d);
    }

    function saveSpecialWeekWizard() {
      var errorEl = document.getElementById('specialWeekWizardError');
      errorEl.textContent = '';

      if (!specialWeekState.patientId) {
        errorEl.textContent = '患者を選択してください';
        return;
      }

      specialWeekState.reason = document.getElementById('specialWeekReason').value || '';

      var items = [];
      document.querySelectorAll('.swTimeType').forEach(function(sel) {
        var key = sel.dataset.k;
        var parts = key.split('|');
        var dateStr = parts[0];
        var rowLabel = parts[1];

        var timeType = sel.value;
        var earliest = document.querySelector('.swEarliest[data-k="' + key + '"]').value;
        var latest = document.querySelector('.swLatest[data-k="' + key + '"]').value;
        var svcMin = document.querySelector('.swSvc[data-k="' + key + '"]').value;
        var start = document.querySelector('.swStart[data-k="' + key + '"]').value;
        var end = document.querySelector('.swEnd[data-k="' + key + '"]').value;
        var needStaffEl = document.querySelector('.swNeedStaff[data-k="' + key + '"]');
        var needStaff = needStaffEl ? Number(needStaffEl.value) || 1 : 1;
        var changeHandleEl = document.querySelector('.swChangeHandle[data-k="' + key + '"]');
        var changeHandle = changeHandleEl ? changeHandleEl.value : 'そのまま残す';

        var hasSomething = (timeType === '固定') ? (start && end) : (earliest && latest && svcMin);
        if (!hasSomething) return;

        items.push({
          dateStr: dateStr,
          rowLabel: rowLabel,
          timeType: timeType,
          earliest: earliest,
          latest: latest,
          svcMin: svcMin,
          needStaff: needStaff,
          start: start,
          end: end,
          note: '',
          changeHandle: changeHandle
        });
      });

      var payload = {
        weekStartStr: formatDateJP(specialWeekState.weekStart),
        patientId: specialWeekState.patientId,
        patientName: specialWeekState.patientName,
        mode: specialWeekState.mode,
        reason: specialWeekState.reason,
        items: items
      };

      var saveBtn = document.getElementById('btnSaveSpecialWeek');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      google.script.run
        .withSuccessHandler(function(result) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存';
          if (result && (result.success || result.ok)) {
            showToast('success', result.message || '特別訪問週間を保存しました');
            closeSpecialWeekWizard();
          } else {
            errorEl.textContent = (result && result.error) || '保存に失敗しました';
          }
        })
        .withFailureHandler(function(e) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存';
          errorEl.textContent = 'エラー: ' + (e.message || String(e));
        })
        .input_saveSpecialWeekWizard(payload);
    }

  </script>
</body>
</html>
