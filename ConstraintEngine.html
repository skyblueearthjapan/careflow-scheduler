    for (var si = 0; si < staffList.length; si++) {
      var staff = staffList[si];
      var staffId = staff.id;

      // Skip if staff is NG
      if (validationMap[staffId] && validationMap[staffId].canAccept === false) continue;

      // Strict mode: also skip WARN staff (soft cap exceeded etc.)
      if (opts.strict && validationMap[staffId] && validationMap[staffId].status === 'WARN') continue;

      // 2名体制: 提案先がペアスタッフと同一ならスキップ（C-1違反）
      if (needStaff >= 2 && pairedStaffId && staffId === pairedStaffId) continue;

      var aw = computeAvailableWindow(pid, dateStr, staffId, state, excludeVisitId);
      if (!aw.windows || aw.windows.length === 0) continue;

      // Record staff window info
      staffWindows.push({
        staffId: staffId,
        staffName: staff.name || staffId,
        windows: aw.windows
      });

      // Scan windows for this staff
      for (var wi = 0; wi < aw.windows.length; wi++) {
        var win = aw.windows[wi];
        for (var t = win.startMin; t + svcMin <= win.endMin; t += stepMin) {
          var slotCenter = t + svcMin / 2;
          var distance = Math.abs(slotCenter - prefCenter);
          var score = Math.max(0, 1000 - distance);

          // Bonus for preferred staff
          if (preferStaffId && staffId === preferStaffId) score += 200;

          // --- 2名体制: ペアスタッフの空き時間チェック ---
          var pairOk = true;
          if (needStaff >= 2 && pairedStaffId && pairedStaffWindows) {
            var pairedAvailable = false;
            for (var pwi = 0; pwi < pairedStaffWindows.length; pwi++) {
              var pw = pairedStaffWindows[pwi];
              if (t >= pw.startMin && t + svcMin <= pw.endMin) {
                pairedAvailable = true;
                break;
              }
            }
            if (!pairedAvailable) {
              pairOk = false;
              score -= 500;
            }
          }

          // Distance scoring (travel time warning)
          var travelNote = '';
          if (!pairOk) {
            travelNote = '\u30da\u30a2\u5bfe\u5fdc\u4e0d\u53ef';
          }
          var staffMaster = getStaff(staffId, state);
          if (staffMaster && staffMaster.lat != null && staffMaster.lng != null &&
              patient && patient.lat != null && patient.lng != null) {
            var distKm = calcDistanceKm(staffMaster.lat, staffMaster.lng,
                                         patient.lat, patient.lng);
            var travelMin = Math.round(distKm / 20 * 60);
            if (travelMin > 30) {
              score -= 100;
              travelNote = (travelNote ? travelNote + ' / ' : '') + '\u79fb\u52d5' + travelMin + '\u5206\u6ce8\u610f';
            } else if (travelMin > 15) {
              score -= 30;
              travelNote = (travelNote ? travelNote + ' / ' : '') + '\u79fb\u52d5' + travelMin + '\u5206';
            }
          }

          // Check adjacent visit travel time
          var adjNote = checkAdjacentTravelTime(staffId, dateStr, t, t + svcMin, state);
          if (adjNote) {
            travelNote = travelNote ? travelNote + ' / ' + adjNote : adjNote;
            score -= 50;
          }

          // Route detour check
          var detour = calcRouteDetour(staffId, dateStr, t, t + svcMin, pid, state);
          if (detour.warningText) {
            travelNote = travelNote ? travelNote + ' / ' + detour.warningText : detour.warningText;
            if (detour.detourKm >= 5) score -= 80;
            else if (detour.detourKm >= 2) score -= 30;
          }

          allCandidates.push({
            startMin: t,
            endMin: t + svcMin,
            score: score,
            label: minutesToTimeStr(t) + '\u301C' + minutesToTimeStr(t + svcMin),
            staffId: staffId,
            staffName: staff.name || staffId,
            travelNote: travelNote,
            pairOk: pairOk
          });
        }
      }
    }

    // Sort by score descending
    allCandidates.sort(function (a, b) { return b.score - a.score; });

    // Deduplicate: no two suggestions within 10 min for same staff
    var suggestions = [];
    for (var ci = 0; ci < allCandidates.length && suggestions.length < maxSuggestions; ci++) {
      var cand = allCandidates[ci];
      var tooClose = false;
      for (var di = 0; di < suggestions.length; di++) {
        if (suggestions[di].staffId === cand.staffId &&
            Math.abs(suggestions[di].startMin - cand.startMin) < 10) {
          tooClose = true;
          break;
        }
      }
      if (!tooClose) {
        suggestions.push(cand);
      }
    }

    var summaryParts = [];
    if (staffWindows.length === 0) {
      summaryParts.push('\u5168\u30b9\u30bf\u30c3\u30d5\u53d7\u5165\u4e0d\u53ef'); // 全スタッフ受入不可
    } else {
      for (var swi = 0; swi < staffWindows.length; swi++) {
        var sw = staffWindows[swi];
        var wTexts = [];
        for (var wti = 0; wti < sw.windows.length; wti++) {
          wTexts.push(minutesToTimeStr(sw.windows[wti].startMin) + '\u301C' +
                      minutesToTimeStr(sw.windows[wti].endMin));
        }
        summaryParts.push(sw.staffName + ': ' + wTexts.join(', '));
      }
    }

    return {
      suggestions: suggestions,
      staffWindows: staffWindows,
      constraintSummary: summaryParts.join(' / ')
    };
  }

  // ===========================================================
  // 9. Distance helpers
  // ===========================================================

  /**
   * Haversine distance between two points in km.
   * Mirrors UnifiedCode.js calcDistanceKm().
   */
  function calcDistanceKm(lat1, lng1, lat2, lng2) {
    if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
    var R = 6371;
    var toRad = Math.PI / 180;
    var dLat = (lat2 - lat1) * toRad;
    var dLng = (lng2 - lng1) * toRad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  /**
   * Estimate travel time in minutes (20 km/h assumption).
   */
  function estimateTravelMin(distKm) {
    if (distKm == null) return null;
    return Math.round(distKm / 20 * 60);
  }

  /**
   * Check travel time to/from adjacent visits for a staff on a date.
   * Returns a warning note if travel time between the proposed slot
   * and adjacent visits exceeds buffer.
   */
  function checkAdjacentTravelTime(staffId, dateStr, slotStart, slotEnd, state) {
    var assignments = getStaffAssignments(staffId, dateStr, state);
    if (assignments.length === 0) return '';

    // Sort by start time
    var sorted = assignments.slice().sort(function (a, b) { return a.startMin - b.startMin; });

    // Find the visits immediately before and after the proposed slot
    var prevVisit = null, nextVisit = null;
    for (var i = 0; i < sorted.length; i++) {
      if (sorted[i].endMin <= slotStart) {
        prevVisit = sorted[i];
      }
      if (sorted[i].startMin >= slotEnd && !nextVisit) {
        nextVisit = sorted[i];
      }
    }

    var warnings = [];
    // Check gap vs travel time to previous visit
    if (prevVisit) {
      var gapPrev = slotStart - prevVisit.endMin;
      var prevPatient = getPatient(prevVisit.pid, state);
      var newPatient = getPatient(null, state); // We need the patient for this slot
      // Use area-based heuristic if lat/lng not available
      if (gapPrev < ASSIGN_BUFFER_MIN) {
        warnings.push('\u524d\u8a2a\u554f\u3068' + gapPrev + '\u5206\u9593\u9694'); // 前訪問とX分間隔
      }
    }
    if (nextVisit) {
      var gapNext = nextVisit.startMin - slotEnd;
      if (gapNext < ASSIGN_BUFFER_MIN) {
        warnings.push('\u6b21\u8a2a\u554f\u3068' + gapNext + '\u5206\u9593\u9694'); // 次訪問とX分間隔
      }
    }

    return warnings.join(', ');
  }

  // ===========================================================
  // 9b. Route Detour Calculation
  // ===========================================================

  /**
   * Calculate route detour distance when inserting a new visit for a staff on a date.
   * Detour = dist(prev→new) + dist(new→next) - dist(prev→next)
   *
   * @param {string} staffId
   * @param {string} dateStr
   * @param {number} newStartMin
   * @param {number} newEndMin
   * @param {string} newPid - Patient ID of the new visit
   * @param {object} state
   * @return {{ detourKm: number|null, warningText: string }}
   */
  function calcRouteDetour(staffId, dateStr, newStartMin, newEndMin, newPid, state) {
    var result = { detourKm: null, warningText: '' };

    var newPatient = getPatient(newPid, state);
    if (!newPatient || newPatient.lat == null || newPatient.lng == null) return result;

    var assignments = getStaffAssignments(staffId, dateStr, state);
    if (assignments.length === 0) return result;

    // Sort by start time
    var sorted = assignments.slice().sort(function(a, b) { return a.startMin - b.startMin; });

    // Find insertion position: prev and next visits
    var prevVisit = null, nextVisit = null;
    for (var i = 0; i < sorted.length; i++) {
      if (sorted[i].endMin <= newStartMin) {
        prevVisit = sorted[i];
      }
      if (sorted[i].startMin >= newEndMin && !nextVisit) {
        nextVisit = sorted[i];
      }
    }

    // Need at least one neighbor to compute detour
    if (!prevVisit && !nextVisit) return result;

    var prevPatient = prevVisit ? getPatient(prevVisit.pid, state) : null;
    var nextPatient = nextVisit ? getPatient(nextVisit.pid, state) : null;

    var distPrevNew = 0, distNewNext = 0, distPrevNext = 0;

    if (prevPatient && prevPatient.lat != null && prevPatient.lng != null) {
      distPrevNew = calcDistanceKm(prevPatient.lat, prevPatient.lng, newPatient.lat, newPatient.lng) || 0;
    }
    if (nextPatient && nextPatient.lat != null && nextPatient.lng != null) {
      distNewNext = calcDistanceKm(newPatient.lat, newPatient.lng, nextPatient.lat, nextPatient.lng) || 0;
    }
    if (prevPatient && prevPatient.lat != null && prevPatient.lng != null &&
        nextPatient && nextPatient.lat != null && nextPatient.lng != null) {
      distPrevNext = calcDistanceKm(prevPatient.lat, prevPatient.lng, nextPatient.lat, nextPatient.lng) || 0;
    }

    var detourKm = distPrevNew + distNewNext - distPrevNext;
    // When only one neighbor exists, detourKm is simply the new leg distance
    if (!prevVisit) detourKm = distNewNext;
    if (!nextVisit) detourKm = distPrevNew;

    result.detourKm = Math.round(detourKm * 10) / 10;

    if (detourKm >= 5) {
      result.warningText = '\u8fc2\u56de+' + result.detourKm + 'km(\u5927)'; // 迂回+X.Xkm(大)
    } else if (detourKm >= 2) {
      result.warningText = '\u8fc2\u56de+' + result.detourKm + 'km'; // 迂回+X.Xkm
    }

    return result;
  }

  // ===========================================================
  // 10. findPairedVisits (public wrapper)
  // ===========================================================

  // Already defined at line ~398 as internal function.
  // Expose via public API below.

  // ===========================================================
  // 11. suggestWithRelaxation
  //     段階的緩和による再挿入提案。
  //     Level 0: 厳格（soft_cap適用、全制約チェック）
  //     Level 1: ソフトキャップ緩和（maxPerDay まで許容）
  //     Level 2: 曜日変更（同一週内の別日に配置）
  //     Level 3: ソフトキャップ緩和 + 曜日変更
  //     各レベルで見つかった時点で提案を返す。
  // ===========================================================

  /** Youbi EN → JA mapping */
  var YOUBI_JA = { Sun: '日', Mon: '月', Tue: '火', Wed: '水', Thu: '木', Fri: '金', Sat: '土' };

  /**
   * 段階的緩和で再挿入提案を生成する。
   *
   * @param {string} pid             - Patient ID
   * @param {string} dateStr         - Original date "yyyy/MM/dd"
   * @param {object} state           - Complete local state
   * @param {object} [options]       - Optional settings
   * @param {number} [options.maxSuggestions=5]
   * @return {{
   *   level: string,
   *   suggestions: object[],
   *   relaxations: string[],
   *   ngReason: string
   * }}
   *   level: 'strict' | 'softcap_relaxed' | 'day_change' | 'softcap_day_change' | 'impossible'
   */
  /**
   * 2名体制のペア検証: 提案リストから2人のスタッフをセットで確保できるものだけを残す。
   * 各提案の staffId(1人目) に対して、同じ時間帯で別スタッフ(2人目)を探す。
   * 見つかった場合、提案に peerStaffId/peerStaffName を付与。
   *
   * @param {object[]} suggestions  - suggestTimeSlotsForAll の結果
   * @param {string}   pid          - Patient ID
   * @param {string}   targetDateStr - 提案先日付
   * @param {object}   state        - Complete local state
   * @param {boolean}  isStrict     - strict モードかどうか
   * @return {object[]} ペア確保できた提案のみ
   */
  function validate2StaffPairs(suggestions, pid, targetDateStr, state, isStrict) {
    if (!suggestions || suggestions.length === 0) return [];
    var validated = [];
    for (var i = 0; i < suggestions.length; i++) {
      var sg = suggestions[i];
      // 同じ日付・同じ患者で、sg.staffId 以外のスタッフを探す
      var peerResult = suggestTimeSlotsForAll(pid, targetDateStr, state, {
        strict: isStrict, maxSuggestions: 10
      });
      var peerFound = null;
      for (var pi = 0; pi < (peerResult.suggestions || []).length; pi++) {
        var ps = peerResult.suggestions[pi];
        if (ps.staffId !== sg.staffId) {
          peerFound = ps;
          break;
        }
      }
      if (peerFound) {
        sg.peerStaffId = peerFound.staffId;
        sg.peerStaffName = peerFound.staffName;
        sg.peerStartMin = sg.startMin; // 2名体制は同時刻
        sg.peerEndMin = sg.endMin;
        sg.needStaff = 2;
        validated.push(sg);
        break; // 1ペア見つかれば十分
      }
    }
    return validated;
  }

  function suggestWithRelaxation(pid, dateStr, state, options) {
    var opts = options || {};
    var maxSuggestions = opts.maxSuggestions || 5;
    var patient = getPatient(pid, state);
    var needStaff = (patient && patient.needStaff) || 1;

    // 各レベルで提案を取得し、2名体制の場合はペア検証を行うヘルパー
    function trySuggestions(targetDate, isStrict, extraMax) {
      var result = suggestTimeSlotsForAll(pid, targetDate, state, {
        strict: isStrict, maxSuggestions: extraMax || maxSuggestions,
        excludeVisitId: opts.excludeVisitId
      });
      var sgs = result.suggestions || [];
      if (sgs.length === 0) return { suggestions: [], result: result };
      if (needStaff >= 2) {
        sgs = validate2StaffPairs(sgs, pid, targetDate, state, isStrict);
      }
      return { suggestions: sgs, result: result };
    }

    // 別日候補を探索するヘルパー（曜日変更）
    function tryAltDays(isStrict) {
      var weekDates = state.weekDates || [];
      var youbiOrig = getYoubiEn(dateStr);
      var altSuggestions = [];
      for (var di = 0; di < weekDates.length; di++) {
        var altDate = weekDates[di];
        if (altDate === dateStr) continue;
        var altYoubi = getYoubiEn(altDate);
        if (patient && patient.ngDays && patient.ngDays.indexOf(altYoubi) >= 0) continue;
        var altPChange = getPatientChange(pid, altDate, state);
        if (altPChange && altPChange.op === '\u30ad\u30e3\u30f3\u30bb\u30eb') continue;
        // 同じ患者が既にその日に割当済みか
        var alreadyOn = false;
        var allV = (state.assignments || []).concat(state.unassigned || []);
        for (var avi = 0; avi < allV.length; avi++) {
          if (allV[avi].pid === pid && allV[avi].dateStr === altDate &&
              allV[avi].staffId !== '__UNASSIGNED__') {
            alreadyOn = true; break;
          }
        }
        if (alreadyOn) continue;
        var altTry = trySuggestions(altDate, isStrict, 5);
        for (var asi = 0; asi < altTry.suggestions.length; asi++) {
          var altSg = altTry.suggestions[asi];
          altSg.altDateStr = altDate;
          altSg.originalDateStr = dateStr;
          altSg.relaxationNote = '曜日変更: ' +
            (YOUBI_JA[youbiOrig] || youbiOrig) + '→' +
            (YOUBI_JA[altYoubi] || altYoubi);
          altSuggestions.push(altSg);
        }
      }
      altSuggestions.sort(function (a, b) { return b.score - a.score; });
      return altSuggestions.slice(0, maxSuggestions);
    }

    // --- Level 0: 厳格モード ---
    var l0 = trySuggestions(dateStr, true);
    if (l0.suggestions.length > 0) {
      return {
        level: 'strict',
        suggestions: l0.suggestions,
        relaxations: [],
        ngReason: ''
      };
    }

    // --- Level 1: ソフトキャップ緩和 ---
    var l1 = trySuggestions(dateStr, false);
    if (l1.suggestions.length > 0) {
      var relaxDetails = [];
      for (var ri = 0; ri < l1.suggestions.length; ri++) {
        var sg = l1.suggestions[ri];
        var staff = getStaff(sg.staffId, state);
        if (staff && staff.maxPerDay != null) {
          var cnt = countStaffDayAssignments(sg.staffId, dateStr, state);
          var sc = getSoftCap(staff);
          if (cnt >= sc) {
            sg.relaxationNote = 'ソフトキャップ超過: ' +
              (staff.name || sg.staffId) + ' ' + dateStr +
              ' 現在' + cnt + '件/推奨' + sc + '件(上限' + staff.maxPerDay + '件)';
            if (relaxDetails.indexOf(sg.relaxationNote) < 0) {
              relaxDetails.push(sg.relaxationNote);
            }
          }
        }
      }
      return {
        level: 'softcap_relaxed',
        suggestions: l1.suggestions,
        relaxations: relaxDetails.length > 0 ? relaxDetails : ['ソフトキャップ超過を許容'],
        ngReason: ''
      };
    }

    // --- Level 2: 曜日変更（厳格） ---
    var l2 = tryAltDays(true);
    if (l2.length > 0) {
      return {
        level: 'day_change',
        suggestions: l2,
        relaxations: ['曜日変更が必要'],
        ngReason: ''
      };
    }

    // --- Level 3: 曜日変更 + ソフトキャップ緩和 ---
    var l3 = tryAltDays(false);
    if (l3.length > 0) {
      return {
        level: 'softcap_day_change',
        suggestions: l3,
        relaxations: ['曜日変更 + ソフトキャップ超過許容が必要'],
        ngReason: ''
      };
    }

    // --- 全条件で割当不可 ---
    var reasons = [];
    if (l0.result && l0.result.ngReason) reasons.push(l0.result.ngReason);
    if (l0.result && l0.result.constraintSummary) reasons.push(l0.result.constraintSummary);
    if (l1.result && l1.result.constraintSummary && reasons.indexOf(l1.result.constraintSummary) < 0) {
      reasons.push(l1.result.constraintSummary);
    }
    if (needStaff >= 2) {
      reasons.push('2名体制: 2人のスタッフをセットで確保できません');
    }

    return {
      level: 'impossible',
      suggestions: [],
      relaxations: [],
      ngReason: reasons.length > 0 ? reasons.join(' / ') : '全スタッフ受入不可'
    };
  }

  // ===========================================================
  // Expose public API via window.ConstraintEngine
  // ===========================================================

  global.ConstraintEngine = {
    // ---- Primary API ----
    validateMove: validateMove,
    validateAllDropTargets: validateAllDropTargets,
    computeImpact: computeImpact,
    validateFixedTime: validateFixedTime,
    repackStaffDay: repackStaffDay,

    // ---- Constraint Window API ----
    computeAvailableWindow: computeAvailableWindow,
    suggestTimeSlots: suggestTimeSlots,
    suggestTimeSlotsForAll: suggestTimeSlotsForAll,
    suggestWithRelaxation: suggestWithRelaxation,

    // ---- Distance helpers ----
    calcDistanceKm: calcDistanceKm,
    estimateTravelMin: estimateTravelMin,
    calcRouteDetour: calcRouteDetour,

    // ---- Paired visit helpers ----
    findPairedVisits: findPairedVisits,
    isPairedVisitId: isPairedVisitId,

    // ---- Helper functions (exposed for testing / external use) ----
    isOverlap: isOverlap,
    minutesToTimeStr: minutesToTimeStr,
    timeStrToMinutes: timeStrToMinutes,
    getYoubiEn: getYoubiEn,
    getStaffBlockedIntervals: getStaffBlockedIntervals,
    getStaffAssignments: getStaffAssignments,
    countStaffDayAssignments: countStaffDayAssignments,

    // ---- Constants (read-only references) ----
    BUFFER_MIN: BUFFER_MIN,
    ASSIGN_BUFFER_MIN: ASSIGN_BUFFER_MIN
  };

})(typeof window !== 'undefined' ? window : this);
</script>
